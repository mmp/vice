name: VC Redist Probe

# One-off: determine which Visual C++ runtime DLLs the MSVC-built
# sherpa-onnx-c-api.dll and onnxruntime.dll require, and upload them as an
# artifact. Delete this workflow once build.bat ships them.

on:
  workflow_dispatch:

jobs:
  probe:
    name: Probe VC runtime dependencies
    runs-on: windows-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v6
      with:
        submodules: true
        lfs: false

    - name: Get sherpa-onnx commit SHA
      id: sherpa-sha
      run: echo "sha=$(git -C sherpa-onnx rev-parse HEAD)" >> $env:GITHUB_OUTPUT
      shell: pwsh

    - name: Restore sherpa-onnx build
      id: cache-sherpa
      uses: actions/cache/restore@v5
      with:
        path: sherpa-onnx/build_go
        key: sherpa-onnx-win-msvc-${{ steps.sherpa-sha.outputs.sha }}

    - name: Build sherpa-onnx with MSVC (cache miss only)
      if: steps.cache-sherpa.outputs.cache-hit != 'true'
      shell: cmd
      run: |
        for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSINSTALL=%%i
        call "%VSINSTALL%\VC\Auxiliary\Build\vcvarsall.bat" x64
        cmake -S sherpa-onnx -B sherpa-onnx\build_go ^
            -G "NMake Makefiles" ^
            -DCMAKE_VS_PLATFORM_NAME=x64 ^
            -DBUILD_SHARED_LIBS=ON ^
            -DSHERPA_ONNX_ENABLE_TTS=ON ^
            -DSHERPA_ONNX_ENABLE_CHECK=OFF ^
            -DSHERPA_ONNX_ENABLE_BINARY=OFF ^
            -DSHERPA_ONNX_ENABLE_WEBSOCKET=OFF ^
            -DSHERPA_ONNX_ENABLE_PORTAUDIO=OFF ^
            -DSHERPA_ONNX_ENABLE_TESTS=OFF ^
            -DSHERPA_ONNX_ENABLE_SPEAKER_DIARIZATION=OFF ^
            -DSHERPA_ONNX_BUILD_C_API_EXAMPLES=OFF ^
            -DCMAKE_BUILD_TYPE=Release
        if errorlevel 1 exit /b 1
        cmake --build sherpa-onnx\build_go

    - name: Walk dependencies and collect redist DLLs
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'

        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        Write-Host "Visual Studio: $vs"

        # Import the MSVC environment so dumpbin and its support DLLs resolve.
        cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
          if ($_ -match '^([^=]+)=(.*)$') { Set-Item -Path "env:$($matches[1])" -Value $matches[2] }
        }

        $redist = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory |
                  Sort-Object FullName | Select-Object -Last 1
        Write-Host "Redist: $($redist.FullName)"

        $roots = @(
          (Get-ChildItem sherpa-onnx/build_go -Recurse -Filter sherpa-onnx-c-api.dll | Select-Object -First 1),
          (Get-ChildItem sherpa-onnx/build_go -Recurse -Filter onnxruntime.dll | Select-Object -First 1)
        )
        foreach ($r in $roots) {
          if (-not $r) { throw "missing input DLL; sherpa-onnx build incomplete" }
        }

        function Get-Dependents($path) {
          (dumpbin /nologo /dependents $path) |
            Select-String -Pattern '^\s+(\S+\.dll)\s*$' |
            ForEach-Object { $_.Matches[0].Groups[1].Value }
        }

        $log = New-Object System.Text.StringBuilder
        $needed = [ordered]@{}
        $queue = New-Object System.Collections.Queue
        foreach ($r in $roots) { $queue.Enqueue($r.FullName) }

        while ($queue.Count -gt 0) {
          $path = $queue.Dequeue()
          $deps = Get-Dependents $path
          [void]$log.AppendLine("=== $path")
          foreach ($d in $deps) { [void]$log.AppendLine("    $d") }
          [void]$log.AppendLine("")

          foreach ($d in $deps) {
            $candidate = Join-Path $redist.FullName $d
            if ((Test-Path $candidate) -and -not $needed.Contains($d)) {
              $needed[$d] = $candidate
              $queue.Enqueue($candidate)
            }
          }
        }

        New-Item -ItemType Directory -Path out | Out-Null
        foreach ($d in $needed.Keys) { Copy-Item $needed[$d] out/ }

        $log.ToString() | Out-File -Encoding utf8 out/dependents.txt
        $redist.FullName | Out-File -Encoding utf8 -Append out/dependents.txt
        (Get-ChildItem $redist.FullName | Select-Object Name, Length | Out-String) |
          Out-File -Encoding utf8 -Append out/dependents.txt

        $summary = "## Required VC runtime DLLs`n`n" +
                   (($needed.Keys | ForEach-Object { "- ``$_``" }) -join "`n") +
                   "`n`nFrom ``$($redist.FullName)```n"
        Write-Host $summary
        $summary | Out-File -Encoding utf8 -Append $env:GITHUB_STEP_SUMMARY

    - name: Upload DLLs and dependency dump
      uses: actions/upload-artifact@v7
      with:
        name: vc-redist-dlls
        path: out/
