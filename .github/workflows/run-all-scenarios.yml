name: Run All Scenarios

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  run-scenarios:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true
        fetch-depth: 0
        lfs: false

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
        cache-dependency-path: go.sum

    - name: Install Linux dependencies
      run: |
        sudo apt update
        sudo apt install xorg-dev libsdl2-dev libsystemd-dev

    - name: Build vice
      run: ./build.sh

    # The key must cover every path .gitattributes tracks with LFS; a path
    # missing here means its objects go stale in the cache and the working-tree
    # files stay as pointer files.
    - name: Restore LFS objects cache
      id: lfs-cache
      uses: actions/cache@v5
      with:
        path: .git/lfs/objects
        key: lfs-objects-v2-${{ hashFiles('.gitattributes', 'resources/videomaps/**', 'resources/wx/**', 'resources/traffic/flights/**') }}

    - name: Fetch LFS
      if: steps.lfs-cache.outputs.cache-hit != 'true'
      run: |
        git lfs install
        git lfs pull

    # The cache holds git's object store, not the working tree, so on a cache
    # hit the files are still pointers until they're checked out. This copies
    # from the local object store and downloads nothing.
    - name: Materialize LFS working-tree files
      run: |
        git lfs install
        git lfs checkout

    - name: Check scenarios
      run: ./vice -lint

    - name: Run all scenarios
      run: ./run-all-scenarios.sh ./vice
    
    - name: Upload logs
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: scenario-logs
        path: |
          scenario-test-*.txt
